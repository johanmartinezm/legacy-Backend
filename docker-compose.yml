version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: legacy_db
    restart: always
    environment:
      POSTGRES_USER: dba
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: applegacy
    ports:
      - "5432:5432"
    volumes:
      - legacy_db_data:/var/lib/postgresql/data
    networks:
      - proxy-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legacy_backend
    restart: always
    depends_on:
      - db
    environment:
      - TZ=America/Bogota
    # Las imagenes que suben los foros. Sin este volumen viven dentro del
    # contenedor y desaparecen enteras en el siguiente despliegue, porque el
    # contenedor se recrea. La ruta coincide con storage.uploads_dir de
    # config.docker.yaml.
    volumes:
      - legacy_uploads:/data/uploads
    networks:
      - proxy-net

volumes:
  legacy_db_data:
  legacy_uploads:

networks:
  proxy-net:
    external: true
